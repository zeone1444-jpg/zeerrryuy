<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEONI IPTV - Fast Engine</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HLS.js Library for M3U8 Live Stream Playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --bg-color: #0f121c;
            --panel-bg: rgba(22, 27, 46, 0.7);
            --accent-cyan: #00f2fe;
            --accent-green: #00e676;
            --accent-pink: #ff2e93;
            --accent-amber: #ffab00;
            --text-light: #f1f5f9;
            --text-dim: #94a3b8;
            --border-glow: rgba(0, 242, 254, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 80px;
            height: 100vh;
            background: rgba(15, 18, 28, 0.95);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            z-index: 100;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar:hover {
            width: 220px;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--accent-cyan);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            padding: 0 25px;
            letter-spacing: 1px;
        }

        .nav-items {
            list-style: none;
            width: 100%;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 18px 25px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            gap: 20px;
        }

        .nav-item i {
            font-size: 1.3rem;
            width: 30px;
            text-align: center;
        }

        .nav-item span {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .sidebar:hover .nav-item span {
            opacity: 1;
        }

        .nav-item:hover, .nav-item.active {
            color: #fff;
            background: linear-gradient(90deg, rgba(0, 242, 254, 0.15) 0%, rgba(0, 0, 0, 0) 100%);
            border-right: 4px solid var(--accent-cyan);
        }

        .nav-item.active i {
            color: var(--accent-cyan);
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        /* Workspace Structure */
        .main-workspace {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
        }

        .view-section {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Top Search and Stats Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .search-box {
            position: relative;
            width: 380px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px var(--border-glow);
        }

        .search-box i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        .server-status {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--panel-bg);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* Content Display Grids */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .media-card {
            background: var(--panel-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .media-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 20px var(--border-glow);
            border-color: var(--accent-cyan);
        }

        .card-img-holder {
            width: 100%;
            height: 180px;
            background: #080a10;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .media-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }

        /* fallback icon if Xtream logo fails to load */
        .no-logo-fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            gap: 8px;
        }

        .no-logo-fallback i {
            font-size: 2.5rem;
            color: var(--accent-cyan);
        }

        .media-info {
            padding: 12px;
            background: rgba(15, 18, 28, 0.9);
        }

        .media-title {
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: var(--accent-cyan);
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-glow);
            z-index: 2;
        }

        /* Loading Spinner */
        .loader-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 300px;
            gap: 20px;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Video Player Screen */
        .player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .player-overlay.active {
            display: flex;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--accent-cyan), #005bea);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-action:hover {
            box-shadow: 0 0 15px var(--border-glow);
        }
    </style>
</head>
<body>

    <!-- Sidebar Bar -->
    <div class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-play"></i>
            <span>ZEONI IPTV</span>
        </div>
        <ul class="nav-items">
            <li class="nav-item active" onclick="switchTab('live')">
                <i class="fa-solid fa-tv"></i>
                <span>القنوات الحية</span>
            </li>
            <li class="nav-item" onclick="switchTab('movies')">
                <i class="fa-solid fa-film"></i>
                <span>الأفلام (VOD)</span>
            </li>
            <li class="nav-item" onclick="switchTab('series')">
                <i class="fa-solid fa-layer-group"></i>
                <span>المسلسلات</span>
            </li>
        </ul>
    </div>

    <!-- Main Workspace -->
    <div class="main-workspace">
        <div class="top-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="filterContent()" placeholder="بحث في كافة القنوات والأفلام...">
            </div>
            <div class="server-status">
                <div class="status-dot"></div>
                <span id="statusText" style="font-size: 0.85rem; color: var(--text-dim);">جاري الاتصال بالسيرفر...</span>
            </div>
        </div>

        <!-- Section 1: Live Channels -->
        <div id="live" class="view-section active">
            <h2 style="margin-bottom: 10px;">القنوات الفضائية المباشرة</h2>
            <div class="media-grid" id="liveGrid">
                <div class="loader-container">
                    <div class="spinner"></div>
                    <p style="color: var(--text-dim);">جاري سحب قنوات وتصاميم Xtream...</p>
                </div>
            </div>
        </div>

        <!-- Section 2: Movies (VOD) -->
        <div id="movies" class="view-section">
            <h2 style="margin-bottom: 10px;">مكتبة الأفلام</h2>
            <div class="media-grid" id="moviesGrid">
                <div class="loader-container">
                    <div class="spinner"></div>
                    <p style="color: var(--text-dim);">جاري تحميل الأفلام...</p>
                </div>
            </div>
        </div>

        <!-- Section 3: Series -->
        <div id="series" class="view-section">
            <h2 style="margin-bottom: 10px;">مكتبة المسلسلات</h2>
            <div class="media-grid" id="seriesGrid">
                <div class="loader-container">
                    <div class="spinner"></div>
                    <p style="color: var(--text-dim);">جاري تحميل المسلسلات...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Player Screen -->
    <div class="player-overlay" id="playerOverlay">
        <div style="position: absolute; top: 20px; right: 20px; z-index: 1001;">
            <button class="btn-action" style="background: var(--accent-pink);" onclick="closePlayer()">إغلاق المشغل <i class="fa-solid fa-xmark"></i></button>
        </div>
        <video id="mainVideo" controls autoplay src=""></video>
    </div>

    <script>
        // Xtream Server Credentials
        const SERVER_CONFIG = {
            host: "http://1.amlive.space",
            user: "2944297191",
            pass: "5284535677"
        };

        let cacheData = {
            live: [],
            movies: [],
            series: []
        };

        let currentActiveTab = 'live';
        let hlsEngine = null;

        function switchTab(tabId) {
            currentActiveTab = tabId;
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            document.getElementById('searchInput').value = '';
            filterContent();
        }

        async function fetchXtreamCategory(action) {
            const url = `${SERVER_CONFIG.host}/player_api.php?username=${SERVER_CONFIG.user}&password=${SERVER_CONFIG.pass}&action=${action}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('فشل جلب البيانات');
                return await response.json();
            } catch (err) {
                console.error(`خطأ أثناء جلب ${action}:`, err);
                return [];
            }
        }

        async function loadAllServerData() {
            document.getElementById('statusText').innerText = "جاري الاتصال وسحب البيانات...";

            // 1. Fetch Live Streams
            const liveStreams = await fetchXtreamCategory('get_live_streams');
            cacheData.live = liveStreams;
            renderLiveGrid(liveStreams);

            // 2. Fetch Movies (VOD)
            const movieStreams = await fetchXtreamCategory('get_vod_streams');
            cacheData.movies = movieStreams;
            renderMoviesGrid(movieStreams);

            // 3. Fetch Series
            const seriesStreams = await fetchXtreamCategory('get_series');
            cacheData.series = seriesStreams;
            renderSeriesGrid(seriesStreams);

            document.getElementById('statusText').innerText = `ZEONI متصل | تم تحميل ${liveStreams.length} قناة`;
        }

        // Render Live Channels with Xtream Logo Integration
        function renderLiveGrid(items) {
            const grid = document.getElementById('liveGrid');
            if(!items || items.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-dim); grid-column: 1 / -1;">لا توجد قنوات متاحة.</p>`;
                return;
            }

            grid.innerHTML = items.slice(0, 150).map(item => {
                const iconUrl = item.stream_icon ? item.stream_icon : '';
                return `
                <div class="media-card" onclick="playStream('${SERVER_CONFIG.host}/live/${SERVER_CONFIG.user}/${SERVER_CONFIG.pass}/${item.stream_id}.m3u8')">
                    <span class="media-badge">مباشر</span>
                    <div class="card-img-holder">
                        ${iconUrl ? `<img src="${iconUrl}" onerror="showFallbackLogo(this)" alt="logo">` : `<div class="no-logo-fallback"><i class="fa-solid fa-tv"></i></div>`}
                    </div>
                    <div class="media-info">
                        <div class="media-title">${item.name}</div>
                    </div>
                </div>
            `}).join('');
        }

        function showFallbackLogo(img) {
            img.parentElement.innerHTML = `<div class="no-logo-fallback"><i class="fa-solid fa-tv"></i></div>`;
        }

        // Render Movies Grid
        function renderMoviesGrid(items) {
            const grid = document.getElementById('moviesGrid');
            if(!items || items.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-dim); grid-column: 1 / -1;">لا توجد أفلام حالياً.</p>`;
                return;
            }

            grid.innerHTML = items.slice(0, 100).map(item => `
                <div class="media-card" onclick="playStream('${SERVER_CONFIG.host}/movie/${SERVER_CONFIG.user}/${SERVER_CONFIG.pass}/${item.stream_id}.${item.container_extension || 'mp4'}')">
                    <span class="media-badge" style="color: var(--accent-green)">${item.rating || 'VOD'}</span>
                    <div class="card-img-holder">
                        <img src="${item.stream_icon || ''}" onerror="showFallbackLogo(this)" alt="poster">
                    </div>
                    <div class="media-info">
                        <div class="media-title">${item.name}</div>
                    </div>
                </div>
            `).join('');
        }

        // Render Series Grid
        function renderSeriesGrid(items) {
            const grid = document.getElementById('seriesGrid');
            if(!items || items.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-dim); grid-column: 1 / -1;">لا توجد مسلسلات حالياً.</p>`;
                return;
            }

            grid.innerHTML = items.slice(0, 100).map(item => `
                <div class="media-card" onclick="alert('مسلسل: ${item.name}\\nجاري تجهيز الحلقات...')">
                    <span class="media-badge" style="color: var(--accent-pink)">مسلسل</span>
                    <div class="card-img-holder">
                        <img src="${item.cover || ''}" onerror="showFallbackLogo(this)" alt="poster">
                    </div>
                    <div class="media-info">
                        <div class="media-title">${item.name}</div>
                    </div>
                </div>
            `).join('');
        }

        // Search Filter Engine
        function filterContent() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const currentData = cacheData[currentActiveTab] || [];
            
            const filtered = currentData.filter(item => item.name && item.name.toLowerCase().includes(query));

            if (currentActiveTab === 'live') renderLiveGrid(filtered);
            if (currentActiveTab === 'movies') renderMoviesGrid(filtered);
            if (currentActiveTab === 'series') renderSeriesGrid(filtered);
        }

        // Playback Handler
        function playStream(url) {
            document.getElementById('playerOverlay').classList.add('active');
            const video = document.getElementById('mainVideo');

            if (hlsEngine) {
                hlsEngine.destroy();
                hlsEngine = null;
            }

            if (Hls.isSupported() && url.includes('.m3u8')) {
                hlsEngine = new Hls({ enableWorker: true, lowLatencyMode: true });
                hlsEngine.loadSource(url);
                hlsEngine.attachMedia(video);
                hlsEngine.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log(e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl') || !url.includes('.m3u8')) {
                video.src = url;
                video.play().catch(e => console.log(e));
            } else {
                alert("المتصفح لا يدعم تشغيل هذا الامتداد مباشرة.");
            }
        }

        function closePlayer() {
            document.getElementById('playerOverlay').classList.remove('active');
            const video = document.getElementById('mainVideo');
            video.pause();
            video.src = "";
            if (hlsEngine) {
                hlsEngine.destroy();
                hlsEngine = null;
            }
        }

        window.onload = () => {
            loadAllServerData();
        };
    </script>
</body>
</html>
